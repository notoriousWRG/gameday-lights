name: release

# Push a tag like v0.2.0 (it must equal the version in pyproject.toml) to publish a release:
# the wheel and sdist, the bootstrap installers, and notes taken from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Tag matches the package version
        run: |
          version="$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $version" >&2
            exit 1
          fi

      - name: Lint and test
        run: |
          uv sync --frozen
          uv run ruff check
          uv run pytest -q

      - name: Build the wheel and sdist
        run: |
          uv build
          # the installers download this exact name
          test -f "dist/gameday_lights-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            BEGIN { gsub(/\./, "\\.", v); head = "^## " v "([^0-9A-Za-z.]|$)" }
            /^## / { if (found) exit; if ($0 ~ head) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="dist/*.whl dist/*.tar.gz deploy/bootstrap.sh"
          [ -f deploy/bootstrap.ps1 ] && assets="$assets deploy/bootstrap.ps1"
          # a tag with letters (v0.2.0rc1) is a pre-release, which "latest" never points at
          flags=""
          case "${GITHUB_REF_NAME#v}" in *[a-zA-Z]*) flags="--prerelease" ;; esac
          # shellcheck disable=SC2086
          gh release create "$GITHUB_REF_NAME" $assets $flags \
            --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
